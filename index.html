<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jankovich Hotel - Hibabejelentés</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f8;
      color: #1f2933;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      margin-top: 24px;
    }

    .hotel {
      font-size: 18px;
      color: #666;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 12px 0;
      color: #1f4e78;
    }

    .location-box {
      background: #e8f3fb;
      border-left: 6px solid #1f4e78;
      padding: 18px;
      border-radius: 12px;
      margin: 24px 0;
    }

    .location-label {
      font-size: 15px;
      color: #555;
      margin-bottom: 6px;
    }

    .location {
      font-size: 34px;
      font-weight: bold;
      color: #1f4e78;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .button {
      display: block;
      text-align: center;
      background: #1f4e78;
      color: white;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
      padding: 18px;
      border-radius: 12px;
      margin-top: 28px;
    }

    .button:hover {
      background: #163a59;
    }

    .small {
      font-size: 14px;
      color: #666;
      margin-top: 24px;
    }

    .error {
      background: #fff3cd;
      border-left: 6px solid #f0ad4e;
      padding: 18px;
      border-radius: 12px;
      margin-top: 24px;
    }

    .list a {
      display: block;
      background: #ffffff;
      margin: 10px 0;
      padding: 14px;
      border-radius: 10px;
      text-decoration: none;
      color: #1f4e78;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="hotel">Jankovich Hotel</div>
      <h1>Hibabejelentés</h1>

      <div id="content"></div>
    </div>
  </div>

  <script>
    const locations = {
      "201": "201-es szoba",
      "202": "202-es szoba",
      "301": "301-es szoba",
      "302": "302-es szoba",
      "401": "401-es szoba",
      "402": "402-es szoba",
      "wellness": "Wellness",
      "konyha": "Konyha",
      "parkolo": "Parkoló",
      "legkezelo": "Légkezelő"
    };

    const formBaseUrl = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx";
    const formId = "DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAANAAQ_0OC9URDEwSFJCQ1NXTEhNUzdKMFJUMFlGWUY4SC4u";
    const locationFieldId = "rf042a28472bb4a3c8a7cd946818fce70";

    const params = new URLSearchParams(window.location.search);
    const hely = params.get("hely");
    const content = document.getElementById("content");

    function createFormsUrl(locationValue) {
      return formBaseUrl + "?id=" + formId + "&" + locationFieldId + "=" + encodeURIComponent(locationValue);
    }

    if (hely && locations[hely.toLowerCase()]) {
      const locationName = locations[hely.toLowerCase()];
      const formsUrl = createFormsUrl(locationName);

      content.innerHTML = `
        <p>Kérjük, az alábbi gombbal indítsa el a hibabejelentést.</p>

        <div class="location-box">
          <div class="location-label">Helyszín</div>
          <div class="location">${locationName}</div>
        </div>

        <p>A hibabejelentő űrlapon a helyszín automatikusan kitöltésre kerül.</p>

        <a class="button" href="${formsUrl}" target="_blank">Hibabejelentés indítása</a>

        <div class="small">
          Ha a helyszín nem megfelelő, jelezze a karbantartásnak vagy a rendszer kezelőjének.
        </div>
      `;
    } else {
      content.innerHTML = `
        <div class="error">
          <strong>Nincs helyszín megadva.</strong><br>
          Válasszon egy demo helyszínt az alábbi listából.
        </div>

        <div class="list">
          <a href="?hely=201">201-es szoba</a>
          <a href="?hely=202">202-es szoba</a>
          <a href="?hely=301">301-es szoba</a>
          <a href="?hely=302">302-es szoba</a>
          <a href="?hely=401">401-es szoba</a>
          <a href="?hely=402">402-es szoba</a>
          <a href="?hely=wellness">Wellness</a>
          <a href="?hely=konyha">Konyha</a>
          <a href="?hely=parkolo">Parkoló</a>
          <a href="?hely=legkezelo">Légkezelő</a>
        </div>
      `;
    }
  </script>
</body>
</html>
